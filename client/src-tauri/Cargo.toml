[package]
name = "client"
version = "0.2.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the WebView2 inspector (F12 / right-click → Inspect)
# reachable in release builds too — without it the feature is compiled out
# and the shortcut silently does nothing.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2"
# File-backed logging: console output (stderr, DevTools) doesn't survive a
# packaged app being launched normally (no console attached) or DevTools
# being closed, so diagnostics need to land somewhere durable.
log = "0.4"
tauri-plugin-log = "2"
# Only here so the frontend can relaunch the app once an update is in place.
tauri-plugin-process = "2"
# `wgc` swaps the legacy GDI grab for Windows.Graphics.Capture, which is the
# only one that can see hardware-accelerated windows (browsers, games).
xcap = { version = "0.9.8", features = ["image", "wgc"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
# WASAPI loopback captures the desktop mix without invoking WebView2's browser
# picker, preserving the native source-selection flow.
wasapi = "0.24"
tauri-winrt-notification = "0.7.3"
windows-version = "0.1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = "4.18"
