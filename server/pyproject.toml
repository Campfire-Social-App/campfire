[project]
name = "campfire-server"
version = "0.1.0"
description = "Campfire — FastAPI core server (auth, channels, messages, gateway, LiveKit token issuance)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.13.3,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "livekit-api>=1.0.0,<2.0.0",
    "aiofiles>=24.1.0,<25.0.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"
httpx = ">=0.27.0,<1.0.0"
aiosqlite = ">=0.20.0,<1.0.0"
ruff = ">=0.7.0,<1.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header"]
