name: Check client

# The Rust side of the client only compiles on a machine with the WebView and
# capture APIs, so a plain `cargo check` on Windows is the cheapest way to keep
# it honest without waiting on a full installer build.
on:
  push:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build an unsigned NSIS installer for Windows VM validation
        type: boolean
        default: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # Type-checks and produces ../dist, which tauri-build expects to exist.
      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Check Rust
        working-directory: client/src-tauri
        run: cargo check --all-targets

      - name: Test Windows startup settings UI
        working-directory: client
        run: npm run test:startup

      - name: Test Windows startup registration
        working-directory: client/src-tauri
        run: cargo test --lib startup::

      - name: Build NSIS installer for validation
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        working-directory: client
        shell: pwsh
        run: |
          $validationConfig = Join-Path $env:RUNNER_TEMP 'campfire-validation.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $validationConfig
          npm run tauri -- build --bundles nsis --no-sign --config $validationConfig

      - name: Upload Windows validation installer
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@v4
        with:
          name: campfire-windows-validation
          path: client/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
