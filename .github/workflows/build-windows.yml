name: Build Windows client

# Manual runs (workflow_dispatch) build the app and publish it to a rolling
# "campfire-dev" draft pre-release, so the latest installer is always one
# click away without creating a new release each time. Pushing a `client-v*`
# tag instead creates a published, versioned release used by the in-app
# updater. Either way the
# .msi/.exe is also attached as a downloadable workflow artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/client-v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=Campfire __VERSION__" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=campfire-dev" >> "$GITHUB_OUTPUT"
            echo "name=Campfire (dev build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize version from tag
        if: startsWith(github.ref, 'refs/tags/client-v')
        working-directory: client
        shell: bash
        run: npm version "${GITHUB_REF_NAME#client-v}" --no-git-tag-version

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY must be configured in repository secrets."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: client
          uploadWorkflowArtifacts: true
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseBody: "Build automático via GitHub Actions."
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
