name: Build Windows client

# Manual runs build the app and attach the .msi/.exe as a downloadable workflow
# artifact (Actions run summary -> Artifacts), no GitHub Release involved.
# Pushing a `client-v*` tag additionally creates a draft GitHub Release with the
# installer attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          uploadWorkflowArtifacts: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/client-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/client-v') && 'Campfire __VERSION__' || '' }}
          releaseBody: "Build automático via GitHub Actions."
          releaseDraft: true
          prerelease: false
