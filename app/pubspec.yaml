name: campfire
description: "Campfire — chat de voz e texto self-hosted"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.0                    # interceptors for the single-flight refresh + upload progress
  file_picker: ^12.0.0             # any file, from the composer's paperclip
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2        # the zustand stores map onto providers 1:1
  flutter_secure_storage: ^11.0.0 # Keychain/Keystore, where secureStore.ts used a plugin store
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  image_picker: ^1.2.3             # camera and gallery, which file_picker does not cover
  intl: ^0.20.3
  json_annotation: ^4.12.0
  livekit_client: ^2.11.0
  lucide_icons_flutter: ^3.1.15   # same icon set the React client draws from
  meta: ^1.18.0                    # @immutable on the pure value types in core/
  url_launcher: ^6.3.2             # hands an attachment to the OS, like `openUrl` does in files.ts
  video_player: ^2.14.0            # the surface under MediaPlayer's own controls
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  stream_channel: ^2.1.4
  very_good_analysis: ^10.3.0

# Launcher icon, fanned out across densities from the two sources in
# `assets/icon/` (see `tool/generate_icon_sources.py`, which makes them from the
# same artwork the Tauri client installs with).
#
#     python3 tool/generate_icon_sources.py
#     dart run flutter_launcher_icons
#
# The generated icons are committed; this only runs again if the art changes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Android 8+ draws the two layers under whatever mask the launcher uses.
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Only ever seen at the corners of the mask, so it is the scene's own night
  # sky rather than a colour of its own.
  adaptive_icon_background: "#0A1436"
  # iOS rejects an icon with an alpha channel outright.
  remove_alpha_ios: true

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  # Both families are variable fonts, shipped as a single file each and driven
  # by `FontVariation('wght', ...)` in the theme rather than by per-weight
  # assets. They are bundled instead of fetched at runtime because the app has
  # to open offline and the typography is part of the identity.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
