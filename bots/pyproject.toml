[project]
name = "campfire-bots"
version = "0.1.0"
description = "Campfire — serviço de bots (interface FastAPI; o primeiro bot é o yt-dlp)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    # Talks to the core server the same way a client does: REST plus the gateway
    # WebSocket that keeps the bot showing as online.
    "httpx>=0.27.0,<1.0.0",
    "websockets>=13.0,<16.0",
    # The realtime SDK, not livekit-api: this side has to *publish* audio into a
    # room, which the token-minting package cannot do.
    "livekit>=1.0.0,<2.0.0",
    "yt-dlp>=2025.1.1",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"
ruff = ">=0.7.0,<1.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
