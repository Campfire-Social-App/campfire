name: campfire-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campfire
      POSTGRES_PASSWORD: campfire
      POSTGRES_DB: campfire
    ports:
      - "5432:5432"
    volumes:
      - campfire_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campfire"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ../server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      # O servidor compartilha a rede do host com o LiveKit; o Postgres publica
      # 5432 no host para continuar acessivel por localhost.
      DATABASE_URL: postgresql+asyncpg://campfire:campfire@127.0.0.1:5432/campfire
      JWT_SECRET: campfire-local-development-secret-2026-admin
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      FIRST_ADMIN_USERNAME: admin
      FIRST_ADMIN_PASSWORD: admin123
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: 26214400
      # Este endereco e devolvido aos clientes, por isso aponta para o host.
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: 324a9697e5bbde9de2844644ac03966ceab4bf67
      BOTS_URL: http://127.0.0.1:8100
      BOTS_SHARED_SECRET: campfire-local-bots-secret
      BOT_USERNAME: ytdlp
      BOT_PASSWORD: ytdlp-local-dev
    # Compartilhar a rede torna a API administrativa do LiveKit e o webhook
    # mutuamente alcancaveis sem depender do firewall entre bridge e host.
    network_mode: host
    volumes:
      - campfire_dev_uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # WebRTC precisa anunciar um endereco alcancavel pelo cliente. Em Linux, a
    # rede do host evita que o LiveKit anuncie o IP interno do container.
    network_mode: host
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro

  bots:
    build: ../bots
    restart: unless-stopped
    depends_on:
      - server
    environment:
      CAMPFIRE_API_URL: http://127.0.0.1:8000
      CAMPFIRE_GATEWAY_URL: ws://127.0.0.1:8000/gateway
      BOT_USERNAME: ytdlp
      BOT_PASSWORD: ytdlp-local-dev
      BOTS_SHARED_SECRET: campfire-local-bots-secret
      # Vazio por padrao: daqui o YouTube costuma resolver sem PO token. Ponha
      # http://127.0.0.1:4416 para exercitar o mesmo caminho da producao.
      YTDLP_POT_BASE_URL: ${YTDLP_POT_BASE_URL:-}
    # Rede do host pelo mesmo motivo do server e do livekit aqui: o SFU anuncia
    # um endereco de host, e a conexao WebRTC do bot precisa chegar nele do
    # mesmo jeito que a de um cliente.
    network_mode: host

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped
    ports:
      - "4416:4416"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  campfire_dev_postgres:
  campfire_dev_uploads:
