name: campfire

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-campfire}
    volumes:
      - campfire_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campfire}"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?defina LIVEKIT_DOMAIN no .env}
    volumes:
      # Gerado por infra/deploy.sh a partir do .env — o livekit.yaml versionado
      # é o template, com as variáveis ainda por substituir.
      - ./livekit/livekit.generated.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881" # RTC TCP fallback
      - "7882:7882/udp" # RTC UDP (porta única, multiplexada)
      - "5349:5349" # TURN TLS

  server:
    build: ../server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campfire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campfire}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      UPLOAD_DIR: /data/uploads
      ENVIRONMENT: production
      # Sem isso um servidor recém-subido não tem admin, e sem admin não há
      # quem gere o primeiro convite. Só cria o usuário se ainda não existir.
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      # Os slash commands passam por aqui antes de chegar no serviço de bots:
      # assim a autenticação fica num lugar só — o bot nunca vê o JWT, e quem
      # diz em que call o autor do comando está é este processo, não o cliente.
      BOTS_URL: http://bots:8100
      BOTS_SHARED_SECRET: ${BOTS_SHARED_SECRET:-}
      # As mesmas credenciais que o serviço de bots usa para logar. A conta é
      # criada aqui no boot, senão um servidor novo não teria em que logar.
      BOT_USERNAME: ${BOT_USERNAME:-ytdlp}
      BOT_PASSWORD: ${BOT_PASSWORD:-}
    volumes:
      - campfire_uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bots:
    build: ../bots
    restart: unless-stopped
    depends_on:
      - server
    # Sem `ports` de propósito: só quem está na rede do compose alcança este
    # serviço, e o Caddy não tem rota para ele.
    environment:
      CAMPFIRE_API_URL: http://server:8000
      CAMPFIRE_GATEWAY_URL: ws://server:8000/gateway
      # Sem estes dois o serviço sobe inerte e avisa no log, em vez de derrubar
      # o deploy inteiro: um serviço novo e opcional não pode impedir a
      # publicação do chat e da voz por causa de um .env desatualizado.
      # Preencha no .env e rode infra/deploy.sh de novo para ligar o bot.
      BOT_USERNAME: ${BOT_USERNAME:-ytdlp}
      BOT_PASSWORD: ${BOT_PASSWORD:-}
      BOTS_SHARED_SECRET: ${BOTS_SHARED_SECRET:-}
      # Vazio = usa a URL que /api/voice/.../token devolve, o mesmo endereço
      # público dos clients. Só aponte para ws://livekit:7880 se a VPS não
      # rotear o próprio IP público de volta para dentro (sem hairpin NAT).
      LIVEKIT_URL_OVERRIDE: ${BOT_LIVEKIT_URL:-}
      # --- Ajuste do YouTube: valores fixos, não lidos do .env ---
      #
      # Estes quatro são versionados de propósito. Não são segredo, e enquanto
      # vinham do .env da máquina cada tentativa abandonada ficava para trás
      # ali (um YTDLP_PLAYER_CLIENTS=android_vr esquecido, por exemplo) e
      # vencia silenciosamente o que o repositório dizia. Mudar de ideia sobre
      # eles agora é um commit, que é o que se quer poder revisar e reverter.
      #
      # Saída pela Cloudflare: o IP da VPS está bloqueado pelo YouTube, e este
      # proxy vale para o yt-dlp e para o ffmpeg — a URL de mídia é assinada
      # com o IP de quem a pediu, então resolver por um endereço e baixar por
      # outro dá 403. Tem que ser HTTP; o ffmpeg não fala SOCKS.
      YTDLP_PROXY: http://warp-http:8888
      # Proof-of-origin token. Não custa nada estando o bgutil de pé, e cobre o
      # caso de o IP limpo ainda assim ser questionado.
      YTDLP_POT_BASE_URL: http://bgutil:4416
      # Vazio = ordem padrão do yt-dlp, que saindo por um IP limpo costuma ser
      # melhor do que forçar um client só.
      YTDLP_PLAYER_CLIENTS: ""
      # Cookies são o último recurso e amarram uma conta Google ao bot. Se for
      # preciso, o arquivo vai em infra/bots-secrets/ e o caminho entra aqui.
      YTDLP_COOKIES_FILE: ""
    volumes:
      # Onde pôr o cookies.txt, se for preciso. O diretório é criado vazio se
      # não existir, então o serviço sobe igual sem ele.
      - ./bots-secrets:/run/bots:ro

  # Gera os proof-of-origin tokens que o YouTube pede. Não publica porta: só o
  # serviço de bots o alcança. Fica de pé mesmo sem YTDLP_POT_BASE_URL — quem
  # decide usá-lo é o bots, e sem a variável ele é só um container ocioso.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped

  # Saída pela Cloudflare, porque o YouTube bloqueia o IP desta VPS. Sobe
  # sempre: quem decide isso é o repositório, não o .env da máquina — foi por
  # depender do .env que a configuração anterior derivou.
  #
  # Para desligar, é um commit removendo este serviço e YTDLP_PROXY acima.
  warp:
    image: caomingjun/warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - campfire_warp:/var/lib/cloudflare-warp

  # O WARP oferece SOCKS5; o ffmpeg só sabe HTTP CONNECT. Esta ponte traduz,
  # para que yt-dlp e ffmpeg saiam pelo mesmo endereço.
  warp-http:
    image: vimagick/tinyproxy
    restart: unless-stopped
    depends_on:
      - warp
    volumes:
      - ./warp/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
      - livekit
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - campfire_caddy_data:/data
      - campfire_caddy_config:/config

volumes:
  campfire_warp:
  campfire_postgres:
  campfire_uploads:
  campfire_caddy_data:
  campfire_caddy_config:
