# Ponte HTTP -> SOCKS5. O WARP fala SOCKS5, e o ffmpeg só sabe HTTP CONNECT
# (`-http_proxy`); sem esta tradução o yt-dlp sairia pela Cloudflare e o ffmpeg
# pelo IP real, e a URL do googlevideo — que é assinada com o IP de quem pediu —
# seria recusada com 403.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600

# Só a rede interna do compose alcança este serviço; ele não publica porta.
Allow 0.0.0.0/0

ConnectPort 443
ConnectPort 80

upstream socks5 warp:1080
