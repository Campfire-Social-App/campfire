# Template da config de produção. O livekit-server NÃO expande variáveis no
# YAML, então infra/deploy.sh roda envsubst neste arquivo com os valores do
# infra/.env e gera livekit.generated.yaml, que é o que o container monta.
port: 7880

rtc:
  tcp_port: 7881
  # Porta UDP única em vez de faixa: o Docker sobe um docker-proxy por porta
  # publicada, e uma faixa de 10 mil portas derrubava a VPS por falta de
  # memória antes do stack terminar de subir. O LiveKit multiplexa todas as
  # sessões nesta porta.
  udp_port: 7882
  use_external_ip: true

keys:
  $LIVEKIT_API_KEY: $LIVEKIT_API_SECRET

webhook:
  api_key: $LIVEKIT_API_KEY
  urls:
    - http://server:8000/api/webhooks/livekit

# TURN embutido, compartilhando 443/TLS — evita rodar um coturn separado.
# Confirmar nomes/portas exatos contra a versão do LiveKit em uso antes do deploy.
turn:
  enabled: true
  domain: $LIVEKIT_DOMAIN
  tls_port: 5349
  external_tls: true

log_level: info
