# Config for local development — non-secret dev keys, no TURN/TLS.
port: 7880

rtc:
  # A stack de producao usa 7881 no mesmo host. Uma porta distinta permite
  # manter os ambientes ativos sem o LiveKit de desenvolvimento falhar no bind.
  tcp_port: 7883
  # Porta UDP unica e multiplexada. Evita conflitos com stacks antigas que
  # ainda tenham a faixa 50000-50100 publicada no host.
  udp_port: 7884
  use_external_ip: false
  # O container usa a rede do host no compose de desenvolvimento. Assim o
  # LiveKit descobre os enderecos reais da maquina e nao anuncia 127.0.0.1 ou
  # um IP interno do Docker como candidato ICE.

keys:
  devkey: 324a9697e5bbde9de2844644ac03966ceab4bf67

webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:8000/api/webhooks/livekit

log_level: info
